services:
  engine:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: readflow-refinery
    volumes:
      - ./data:/root/data 
    ports:
      - "8080:8080"

  hud:
    build: ./web
    container_name: readflow-hud
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    working_dir: /app/web    
    command: python -m uvicorn app:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - engine